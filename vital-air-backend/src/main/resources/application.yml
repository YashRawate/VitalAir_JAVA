server:
  port: ${PORT:8080}

spring:
  application:
    name: vital-air-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:vitalair;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  h2:
    console:
      enabled: ${H2_CONSOLE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.vitalair: INFO

# ========== Vital Air application config ==========
vitalair:
  jwt:
    secret: ${VITALAIR_JWT_SECRET:}
    expiration-ms: ${VITALAIR_JWT_EXPIRATION_MS:86400000}

  api-keys:
    openweather: ${OPENWEATHER_API_KEY:}
    tomtom: ${TOMTOM_API_KEY:}
    nasa-firms: ${NASA_FIRMS_API_KEY:}
    openaq: ${OPENAQ_API_KEY:}

  external-apis:
    openweather-aqi-url: https://api.openweathermap.org/data/2.5/air_pollution
    openweather-weather-url: https://api.openweathermap.org/data/2.5/weather
    openaq-url: https://api.openaq.org/v2/latest
    open-meteo-aqi-url: https://air-quality-api.open-meteo.com/v1/air-quality
    open-meteo-weather-url: https://api.open-meteo.com/v1/forecast
    timeout-seconds: 10

  # Static region/city reference data - replaces the hardcoded REGIONS / CITIES
  # dicts in the original main.py. Add new regions/cities here without a rebuild.
