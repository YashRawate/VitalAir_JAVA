      cities:
        - { name: "New Delhi", lat: 28.6139, lon: 77.2090, type: capital, base-aqi: 178 }
        - { name: "Anand Vihar", lat: 28.6468, lon: 77.3164, type: hotspot, base-aqi: 245 }
        - { name: "ITO", lat: 28.6298, lon: 77.2423, type: hotspot, base-aqi: 215 }
